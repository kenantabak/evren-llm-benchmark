[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-llm-bench"
version = "1.0.0"
description = "Open-source reproducible LLM, Vision, OCR, Tool-Calling, Long-Context and Reasoning-Effort benchmark suite for EVREN LLM API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
